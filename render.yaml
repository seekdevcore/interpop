# Render Blueprint: site demo do Interpop para o design (plano free).
#
# O que sobe: só o frontend estático, buildado com `--mode demo`. Não há
# backend: toda a API /api/v1/* é respondida no navegador pelo MSW
# (src/mocks/handlers + src/mocks/demo), com dados fictícios guardados no
# localStorage de cada visitante. Nada aqui fala com a produção
# (Hostinger) nem guarda segredo.
#
# Deploy: a cada push na `develop`, mas só depois que os checks do GitHub
# (CI) passarem (`autoDeployTrigger: checksPass`).
# Como criar: Render → New → Blueprint → repositório interpop → Apply.
services:
  - type: web
    runtime: static
    name: interpop-demo
    branch: develop
    autoDeployTrigger: checksPass
    # Node 22 vem do .nvmrc (o mesmo do CI)
    buildCommand: npm ci && npm run build:demo
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # Demo não deve aparecer no Google nem competir com o site real
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      # Worker do MSW sempre revalidado, para um deploy novo valer na hora
      - path: /mockServiceWorker.js
        name: Cache-Control
        value: no-cache
    routes:
      # SPA: o React Router resolve a rota. Arquivos que existem em dist/
      # (assets, mockServiceWorker.js) são servidos antes do rewrite.
      - type: rewrite
        source: /*
        destination: /index.html
